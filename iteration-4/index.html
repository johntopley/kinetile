<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kinetile — Iteration 4</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #f4f7fb;
        font-family: "Segoe UI", "Helvetica Neue", sans-serif;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100%;
      }

      canvas {
        width: min(96vw, calc(96vh * 960 / 720));
        height: auto;
        aspect-ratio: 960 / 720;
        background: #000;
        image-rendering: auto;
      }

      p {
        margin: 12px 0 0;
        font-size: 14px;
        color: #9aa6b2;
      }

      a {
        color: #d7dee6;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="960" height="720" aria-label="Kinetile playfield"></canvas>
    <p><a href="../">All iterations</a> · A/D or arrows move · Space serves · break the wall</p>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
